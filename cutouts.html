<body class="cutoutbody">

<div class="grain" aria-hidden="true"></div>

<div class="mark tl">systems systems systems</div>
<div class="mark tr"><a href="index.html">&larr; field</a></div>
<div class="mark br"><a href="grid.html">grid &rarr;</a></div>
<button type="button" class="clearbtn" id="cutclear" aria-pressed="false" aria-label="hide the interface for a clean view">hide ui</button>
<!-- phones only: collapses the dev control rows so the page opens clean -->
<button type="button" class="panelbtn" id="cutctrls" aria-pressed="false" aria-expanded="false" aria-controls="cutpanel">controls</button>

<!-- the compositor surface: filled and moved by cutouts.js -->
<main class="cutstage" id="cutstage" aria-label="cutouts — a new composition every load"></main>

<div class="cutscrim t" aria-hidden="true"></div>
<div class="cutscrim b" aria-hidden="true"></div>
<div class="cutscrim bl" aria-hidden="true"></div>

<nav id="cutpanel" aria-label="compositor controls">
  <div class="crow"><span class="clab">blend</span><div class="copts" id="cutblend"></div></div>
  <div class="crow"><span class="clab">scale</span><div class="copts" id="cutscale"></div></div>
  <div class="crow"><span class="clab">motion</span><div class="copts" id="cutmotion"></div></div>
  <div class="crow"><span class="clab">count</span>
    <div class="cstepper">
      <button type="button" id="cutless" aria-label="fewer cutouts">&minus;</button>
      <span class="cval" id="cutcount">5</span>
      <button type="button" id="cutmore" aria-label="more cutouts">+</button>
    </div>
  </div>
  <div class="crow cedit"><span class="clab">size</span>
    <input type="range" class="csize" id="cutsize" min="0" max="1000" value="500" aria-label="resize selected cutout"></div>
  <div class="crow cedit"><span class="clab">rotate</span>
    <input type="range" class="csize" id="cutrot" min="0" max="360" value="0" aria-label="rotate selected cutout"></div>
  <div class="crow cedit">
    <button type="button" class="cdup" id="cutdup">duplicate</button>
    <button type="button" class="cpinv" id="cutpinv" aria-pressed="false">invert</button>
  </div>
  <div class="crow cedit">
    <button type="button" class="clock" id="cutlock" aria-pressed="false">motion lock</button>
    <button type="button" class="cdel" id="cutdel">remove</button>
  </div>
  <div class="crow cactions">
    <button type="button" class="crecompose" id="cutrecompose">recompose</button>
    <button type="button" class="csave" id="cutsave">save frame</button>
    <button type="button" class="cinvert" id="cutinvert" aria-pressed="false">invert</button>
  </div>
</nav>

<!-- appears while dragging a piece; drop a piece here to remove it -->
<div class="cutbin" id="cutbin" aria-hidden="true">remove</div>

<!-- cutout palette: drag (desktop) or tap (mobile) a cutout onto the canvas -->
<aside class="cuttray" id="cuttray" aria-label="cutout palette">
  <button type="button" class="tray-handle" id="trayHandle" aria-expanded="false" aria-controls="trayItems">cutouts</button>
  <div class="tray-items" id="trayItems"></div>
</aside>

<script src="works.js"></script>
<script src="assets/js/cutouts-extra.js"></script>
<script src="assets/js/cutouts.js"></script>
</body>
</html>
